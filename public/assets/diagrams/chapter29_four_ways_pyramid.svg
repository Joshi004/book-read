<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif">

  <!-- Layer 1: People Are Broken (bottom, widest, most reactive) -->
  <polygon points="94,270 506,270 560,355 40,355" fill="#B23A48"/>

  <!-- Layer 2: People Are Different -->
  <polygon points="148,185 452,185 506,270 94,270" fill="#C4536B"/>

  <!-- Layer 3: People Are Facts -->
  <polygon points="201,100 399,100 452,185 148,185" fill="#4A7BAD"/>

  <!-- Layer 4: People Are Reasons (top, narrowest, the goal) -->
  <polygon points="255,15 345,15 399,100 201,100" fill="#1E3D5C"/>

  <!-- Subtle dividers between layers -->
  <line x1="94"  y1="270" x2="506" y2="270" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="148" y1="185" x2="452" y2="185" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="201" y1="100" x2="399" y2="100" stroke="white" stroke-width="1" opacity="0.25"/>

  <!-- Outer pyramid outline — visible on both light and dark backgrounds -->
  <polygon points="255,15 345,15 560,355 40,355" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Layer 4 label: People Are Reasons (band center y=57.5) -->
  <text x="300" y="34" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-size="9" letter-spacing="1" font-weight="600">PEOPLE ARE</text>
  <text x="300" y="54" text-anchor="middle" fill="white" font-size="15" font-weight="700">REASONS</text>
  <text x="300" y="73" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-size="8">No judgment — Law 4 in view</text>

  <!-- Layer 3 label: People Are Facts (band center y=142.5) -->
  <text x="300" y="119" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-size="9" letter-spacing="1" font-weight="600">PEOPLE ARE</text>
  <text x="300" y="139" text-anchor="middle" fill="white" font-size="15" font-weight="700">FACTS</text>
  <text x="300" y="158" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-size="8">Resigned — nothing will change them</text>

  <!-- Layer 2 label: People Are Different (band center y=227.5) -->
  <text x="300" y="204" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-size="9" letter-spacing="1" font-weight="600">PEOPLE ARE</text>
  <text x="300" y="224" text-anchor="middle" fill="white" font-size="15" font-weight="700">DIFFERENT</text>
  <text x="300" y="243" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-size="8">Emotional, but takes no action</text>

  <!-- Layer 1 label: People Are Broken (band center y=312.5) -->
  <text x="300" y="288" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-size="9" letter-spacing="1" font-weight="600">PEOPLE ARE</text>
  <text x="300" y="308" text-anchor="middle" fill="white" font-size="15" font-weight="700">BROKEN</text>
  <text x="300" y="328" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-size="8">Reactive — fights to reestablish power</text>

</svg>
